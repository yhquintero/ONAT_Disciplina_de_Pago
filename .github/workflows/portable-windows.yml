name: Aplicación portátil para Windows

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'electron/**'
      - 'assets/onat.ico'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/portable-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    name: Empaquetar Windows x64 sin instalación
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias de compilación
        run: npm ci
      - name: Validar pruebas y sitio web
        run: npm run check
      - name: Crear paquete portable para Windows x64
        run: npm run package:portable:windows
      - name: Publicar paquete como artefacto descargable
        uses: actions/upload-artifact@v7
        with:
          name: ONAT-Disciplina-de-Pago-portable-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
